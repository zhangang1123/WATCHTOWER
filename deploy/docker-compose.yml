services:
  watchtower-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "${WATCHTOWER_PORT:-8080}:${WATCHTOWER_PORT:-8080}"
    env_file:
      - ../.env
    environment:
      - WATCHTOWER_MODE=gateway
      - WATCHTOWER_BRAIN_ADDR=watchtower-brain:${BRAIN_GRPC_PORT:-50052}
      - WATCHTOWER_MOCK_CONTROL_URL=http://watchtower-mock:${MOCK_K8S_PORT:-8081}
      - WATCHTOWER_DB_PATH=/data/watchtower.db
      - WATCHTOWER_LOG_LEVEL=info
    volumes:
      - watchtower-data:/data
    depends_on:
      watchtower-brain:
        condition: service_healthy
      watchtower-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:${WATCHTOWER_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - watchtower-net

  watchtower-brain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.brain
    ports:
      - "${BRAIN_GRPC_PORT:-50052}:${BRAIN_GRPC_PORT:-50052}"
    env_file:
      - ../.env
    environment:
      - MOCK_PROMETHEUS_URL=http://watchtower-mock:${MOCK_PROMETHEUS_PORT:-9090}
      - MOCK_K8S_URL=http://watchtower-mock:${MOCK_K8S_PORT:-8081}
    depends_on:
      watchtower-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; s=socket.create_connection(('127.0.0.1',int(os.getenv('BRAIN_GRPC_PORT','50052'))),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - watchtower-net

  watchtower-mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mockinfra
    ports:
      - "${MOCK_PROMETHEUS_PORT:-9090}:${MOCK_PROMETHEUS_PORT:-9090}"
      - "${MOCK_K8S_PORT:-8081}:${MOCK_K8S_PORT:-8081}"
    env_file:
      - ../.env
    environment:
      - MOCK_MODE=infra
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:${MOCK_K8S_PORT:-8081}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - watchtower-net

volumes:
  watchtower-data:

networks:
  watchtower-net:
    driver: bridge
